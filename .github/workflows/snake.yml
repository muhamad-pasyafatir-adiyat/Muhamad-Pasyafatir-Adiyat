name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # jalan otomatis setiap hari jam 00:00 UTC
  workflow_dispatch: # bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: muhamad-pasyafatir-adiyat
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_dots=#1e0a3c,#4c1d95,#7c3aed,#a855f7,#ff4d00&color_snake=#ff4d00

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
